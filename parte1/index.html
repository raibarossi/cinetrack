<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>

    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Metal+Mania&family=Nosifer&family=Special+Elite&display=swap" rel="stylesheet">
</head>
<body>

    <header>
        <h1>CineTrack</h1>

        <input
            class="search"
            type="search"
            aria-label="Buscar filme"
            placeholder="Buscar filme"
        >

        <button type="button" class="anchoradd" id="btn-adicionar">
            <span class="texto-mobile">+</span>
            <span class="texto-desktop">+ Adicionar</span>
        </button>
    </header>

    <nav aria-label="Filtros de status">
        <button type="button" class="ativo" data-status="todos">Todos</button>
        <button type="button" data-status="assistido">Assistido</button>
        <button type="button" data-status="assistindo">Assistindo</button>
        <button type="button" data-status="quero">Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite"></section>

        <div id="modal" hidden>
            <div class="modal-conteudo">
                <h2 id="modal-titulo">Adicionar filme</h2>

                <form id="form-filme" novalidate>
                    <label for="titulo-modal">Título</label>
                    <input
                        id="titulo-modal"
                        name="titulo"
                        type="text"
                        required
                    >

                    <label for="ano-modal">Ano</label>
                    <input
                        id="ano-modal"
                        name="ano"
                        type="number"
                        min="1888"
                        max="2030"
                        required
                    >

                    <label for="genero-modal">Gênero</label>
                    <input
                        id="genero-modal"
                        name="genero"
                        type="text"
                        required
                    >

                    <label for="url-modal">URL do pôster</label>
                    <input
                        id="url-modal"
                        name="poster"
                        type="url"
                    >

                    <label for="status-modal">Status</label>
                    <select id="status-modal" name="status" required>
                        <option value="">Selecione um status</option>
                        <option value="assistido">Assistido</option>
                        <option value="assistindo">Assistindo</option>
                        <option value="quero">Quero assistir</option>
                    </select>

                    <label for="nota-modal">Nota (1 a 5)</label>
                    <input
                        id="nota-modal"
                        name="nota"
                        type="number"
                        min="1"
                        max="5"
                        required
                    >

                    <label for="comentario-modal">Comentário</label>
                    <textarea
                        id="comentario-modal"
                        name="comentario"
                    ></textarea>

                    <p id="erros-form" role="alert" hidden></p>

                    <div class="acoes">
                        <button type="submit">Salvar</button>
                        <button type="button" id="btn-cancelar">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <footer>
        <small></small>
    </footer>

    <script src="app.js"></script>
</body>
</html>
